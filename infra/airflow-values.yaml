images:
  airflow:
    repository: local/airflow
    tag: "dev"

env:
  - name: AWS_DEFAULT_REGION
    value: ${aws_region}
  - name: AWS_ENDPOINT_URL
    value: "${localstack_endpoint_url}"
  - name: KUBE_CONTEXT
    value: ${kube_context}
  - name: DATA_LAB_NAMESPACE
    value: ${data_lab_namespace}
  - name: AIRFLOW_NAMESPACE
    value: ${airflow_namespace}
  - name: RAW_SATELLITE_BUCKET
    value: ${raw_satellite_bucket}
  - name: PROCESSED_AOI_BUCKET
    value: ${processed_aoi_bucket}
  - name: AIRFLOW_DAGS_BUCKET
    value: ${airflow_dags_bucket}
  - name: AIRFLOW_AWS_ENDPOINT_URL
    value: "${localstack_endpoint_url}"
  - name: AIRFLOW__AWS__ENDPOINT_URL
    value: "${localstack_endpoint_url}"

secret:
  - envName: AWS_ACCESS_KEY_ID
    secretName: ${aws_credentials_secret_name}
    secretKey: AWS_ACCESS_KEY_ID
  - envName: AWS_SECRET_ACCESS_KEY
    secretName: ${aws_credentials_secret_name}
    secretKey: AWS_SECRET_ACCESS_KEY

executor: KubernetesExecutor

airflow:
  migrationsWaitTimeout: 600
  AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 30
  connections:
    - id: aws_default
      type: aws
      extra: |
        {"endpoint_url": "${localstack_endpoint_url}"}

postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnami/postgresql
    tag: "latest"
  auth:
    username: airflow
    password: airflow
    database: airflow


webserver:
  enabled: true
  defaultUser:
    enabled: true
    username: admin
    password: admin
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: "0.2"
      memory: "256Mi"

scheduler:
  resources:
    requests:
      cpu: "0.2"
      memory: "256Mi"

worker:
  resources:
    requests:
      cpu: "0.2"
      memory: "256Mi"

triggerer:
  resources:
    requests:
      cpu: "0.2"
      memory: "256Mi"

dags:
  persistence:
    enabled: true
    size: 512Mi

createUserJob:
  useHelmHooks: false
  applyCustomEnv: false

migrateDatabaseJob:
  useHelmHooks: false
  applyCustomEnv: false
