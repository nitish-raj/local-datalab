images:
  airflow:
    repository: apache/airflow
    tag: "3.1.5"

env:
  - name: AWS_ACCESS_KEY_ID
    value: test
  - name: AWS_SECRET_ACCESS_KEY
    value: test
  - name: AWS_DEFAULT_REGION
    value: eu-central-1
  - name: AIRFLOW__AWS__ENDPOINT_URL
    value: http://localstack.data-lab.svc.cluster.local:4566

executor: KubernetesExecutor

airflow:
  migrationsWaitTimeout: 600
  AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 30
  connections:
    - id: aws_default
      type: aws
      extra: |
        {"endpoint_url": "http://localstack.data-lab.svc.cluster.local:4566"}

postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnami/postgresql
    tag: "latest"
  auth:
    username: airflow
    password: airflow
    database: airflow


webserver:
  enabled: true
  defaultUser:
    enabled: true
    username: admin
    password: admin
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"

scheduler:
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"

worker:
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"

triggerer:
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"

dags:
  persistence:
    enabled: true
    size: 512Mi

createUserJob:
  useHelmHooks: false
  applyCustomEnv: false

migrateDatabaseJob:
  useHelmHooks: false
  applyCustomEnv: false