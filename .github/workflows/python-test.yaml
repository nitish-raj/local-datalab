name: python-test

on:
  push:
    branches:
      - main
    paths:
      - "**/*.py"

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
      - name: Install Airflow and test dependencies
        run: |
          uv pip install --system -r requirements/dev.txt
      - name: Run lint checks
        run: |
          ruff check airflow
      - name: Run Airflow DAG tests
        run: |
          python -m pytest airflow/tests/test_dags/ -v
      - name: Run Airflow plugin tests
        run: |
          python -m pytest airflow/tests/test_plugins/ -v
